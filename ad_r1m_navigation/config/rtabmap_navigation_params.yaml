#-----------------------------------------------------------------------------
# Nav2 parameters for use with RTAB-Map (replaces AMCL)
# Based on navigation_params.yaml with Vector Pursuit controller
#
# Key differences from standard Nav2:
# - No AMCL (RTAB-Map provides localization via map->odom TF)
# - Map topic from RTAB-Map (/rtabmap/map or /map)
# - Costmap can use RTAB-Map obstacle cloud for real-time updates
#-----------------------------------------------------------------------------

#-----------------------------------------------------------------------------
# Costmap parameters: local and global
# Uses RTAB-Map published map for static layer
#-----------------------------------------------------------------------------
local_costmap:
  local_costmap:
    ros__parameters:
      global_frame: odom
      robot_base_frame: base_link

      update_frequency: 5.0
      publish_frequency: 2.0
      use_sim_time: False
      rolling_window: true
      width: 3
      height: 3
      origin_x: -1.5
      origin_y: -1.5
      resolution: 0.05
      robot_radius: 0.31
      footprint: "[ [0.30, -0.15], [-0.30, -0.15], [-0.30, 0.15], [0.30, 0.15] ]"
      plugins: ["voxel_layer", "inflation_layer"]

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 20.0
        inflation_radius: 0.8

      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan rtabmap_obstacles
        scan:
          topic: scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
        # RTAB-Map obstacle point cloud for additional coverage
        rtabmap_obstacles:
          topic: camera/obstacles
          max_obstacle_height: 2.0
          min_obstacle_height: 0.05
          clearing: False
          marking: True
          data_type: "PointCloud2"
          obstacle_max_range: 4.0
          obstacle_min_range: 0.3

      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      robot_base_frame: base_link
      # Dynamic sizing - RTAB-Map map can grow
      width: 100
      height: 100
      origin_x: -50.0
      origin_y: -50.0
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      use_sim_time: False
      footprint: "[ [0.30, -0.15], [-0.30, -0.15], [-0.30, 0.15], [0.30, 0.15] ]"
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.3
          obstacle_max_range: 2.5
          obstacle_min_range: 0.3

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
        # RTAB-Map publishes to /map (or /rtabmap/map with namespace)
        map_topic: map

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.2

      always_send_full_costmap: True

#-----------------------------------------------------------------------------
# Planner: NavFn grid-based path planning
#-----------------------------------------------------------------------------
planner_server:
  ros__parameters:
    planner_plugins: ['GridBased']
    GridBased:
      plugin: 'nav2_navfn_planner/NavfnPlanner'
    expected_planner_frequency: 10.0

#-----------------------------------------------------------------------------
# Controller: Vector Pursuit (smoother than DWB for differential drive)
#-----------------------------------------------------------------------------
controller_server:
  ros__parameters:
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.0001
    min_y_velocity_threshold: 0.1
    min_theta_velocity_threshold: 0.0001
    failure_tolerance: 0.3

    odom_topic: "odometry/filtered"
    enable_stamped_cmd_vel: false

    controller_plugins: ["FollowPath"]
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]

    # Vector Pursuit Controller - smoother path execution
    FollowPath:
      plugin: "vector_pursuit_controller::VectorPursuitController"
      k: 10.0                        # higher = faster translation
      desired_linear_vel: 0.5        # target velocity (m/s)
      min_linear_velocity: 0.1
      min_turning_radius: 0.0
      max_lateral_accel: 1.0
      max_linear_accel: 1.0

      use_rotate_to_heading: true
      rotate_to_heading_angular_vel: 1.0
      rotate_to_heading_min_angle: 0.1  # ~5.7 degrees
      max_angular_accel: 1.0

      allow_reversing: false

    progress_checker:
      plugin: "nav2_controller::PoseProgressChecker"
      required_movement_radius: 0.1
      required_movement_angle: 0.1
      movement_time_allowance: 3.0

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: True
      xy_goal_tolerance: 0.10        # 10 cm
      yaw_goal_tolerance: 0.15       # ~8.6 degrees

#-----------------------------------------------------------------------------
# Behavior Server
#-----------------------------------------------------------------------------
behavior_server:
  ros__parameters:
    global_frame: odom
    robot_base_frame: base_link

    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
      distance: 0.1
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    transform_tolerance: 0.2
    use_sim_time: False
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.3
    rotational_acc_lim: 1.0

#-----------------------------------------------------------------------------
# BT Navigator
#-----------------------------------------------------------------------------
bt_navigator:
  ros__parameters:
    navigators: ['navigate_to_pose']
    robot_base_frame: base_link
    odom_topic: odometry/filtered
